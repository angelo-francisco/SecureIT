name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ steps.get_tag.outputs.tag }}
      models_sha: ${{ steps.package_models.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "SecureIT ${{ steps.get_tag.outputs.tag }}"
          draft: true
          generate_release_notes: true

      - name: Download facenet and yolo
        run: |
          mkdir -p /tmp/secureit-models
          curl -L -o /tmp/secureit-models/vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
          curl -L -o /tmp/secureit-models/yolo26n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt

      - name: Package models
        id: package_models
        run: |
          cd /tmp/secureit-models
          zip -r models-v1.zip .
          echo "sha=$(sha256sum models-v1.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload models
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: /tmp/secureit-models/models-v1.zip
          overwrite_files: true

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen
          uv add pyinstaller
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Get version
        id: version
        shell: bash
        run: echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.create-release.outputs.tag }}

      - name: Package API payload
        shell: pwsh
        working-directory: desktop/api
        env:
          VER: ${{ steps.version.outputs.ver }}
          TARGET: windows-x86_64
          MODELS_SHA: ${{ needs.create-release.outputs.models_sha }}
        run: |
          $base = "https://github.com/angelo-francisco/SecureIT/releases/latest/download"
          Push-Location dist
          Compress-Archive -Path desktop-api -DestinationPath "../api-$env:TARGET-$env:VER.zip" -Force
          Pop-Location
          $apiSha = (Get-FileHash "api-$env:TARGET-$env:VER.zip" -Algorithm SHA256).Hash.ToLower()
          $json = @{
            api = @{
              version = $env:VER
              url     = "$base/api-$env:TARGET-$env:VER.zip"
              sha256  = $apiSha
            }
            models = @{
              version = "v1"
              url     = "$base/models-v1.zip"
              sha256  = $env:MODELS_SHA
            }
          } | ConvertTo-Json
          Set-Content -Path "payload-$env:TARGET.json" -Value $json

      - name: Set app version
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw
          $json = $json -replace '"version"\s*:\s*"[^"]*"', ('"version": "' + $env:VER + '"')
          Set-Content -Path $path -Value $json -NoNewline
        env:
          VER: ${{ steps.version.outputs.ver }}

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename installers
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Move-Item $exe.FullName "src-tauri/target/release/bundle/nsis/SecureIT.exe" -Force

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          Move-Item $msi.FullName "src-tauri/target/release/bundle/msi/SecureIT.msi" -Force

      - name: Generate updater manifest
        shell: pwsh
        run: |
          python scripts/gen-updater-json.py `
            --target windows-x86_64 `
            --version $env:VER `
            --bundle-sig "src-tauri/target/release/bundle/nsis/*.exe.sig" `
            --bundle-url "https://github.com/angelo-francisco/SecureIT/releases/latest/download/SecureIT.exe" `
            --out latest-windows-x86_64.json
        env:
          VER: ${{ steps.version.outputs.ver }}

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          overwrite_files: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/SecureIT.msi
            desktop/src-tauri/target/release/bundle/nsis/SecureIT.exe
            desktop/api/api-windows-x86_64-${{ steps.version.outputs.ver }}.zip
            desktop/api/payload-windows-x86_64.json
            desktop/latest-windows-x86_64.json

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen
          uv add pyinstaller
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Get version
        id: version
        run: echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.create-release.outputs.tag }}

      - name: Package API payload
        working-directory: desktop/api
        env:
          VER: ${{ steps.version.outputs.ver }}
          TARGET: linux-x86_64
          MODELS_SHA: ${{ needs.create-release.outputs.models_sha }}
        run: |
          set -euo pipefail
          BASE="https://github.com/angelo-francisco/SecureIT/releases/latest/download"
          cd dist
          zip -r "../api-${TARGET}-${VER}.zip" desktop-api
          cd ..
          API_SHA=$(sha256sum "api-${TARGET}-${VER}.zip" | awk '{print $1}')
          cat > "payload-${TARGET}.json" <<EOF
          {
            "api": {
              "version": "${VER}",
              "url": "${BASE}/api-${TARGET}-${VER}.zip",
              "sha256": "${API_SHA}"
            },
            "models": {
              "version": "v1",
              "url": "${BASE}/models-v1.zip",
              "sha256": "${MODELS_SHA}"
            }
          }
          EOF

      - name: Set app version
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" src-tauri/tauri.conf.json
        env:
          VER: ${{ steps.version.outputs.ver }}

      - name: Build Tauri app
        run: bun run tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename package
        run: |
          mv src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/SecureIT.deb
          mv src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/SecureIT-x86_64.AppImage

      - name: Generate updater manifest
        run: |
          python scripts/gen-updater-json.py \
            --target linux-x86_64 \
            --version "$VER" \
            --bundle-sig "src-tauri/target/release/bundle/appimage/*.AppImage.sig" \
            --bundle-url "https://github.com/angelo-francisco/SecureIT/releases/latest/download/SecureIT-x86_64.AppImage" \
            --out latest-linux-x86_64.json
        env:
          VER: ${{ steps.version.outputs.ver }}

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          overwrite_files: true
          files: |
            desktop/src-tauri/target/release/bundle/deb/SecureIT.deb
            desktop/src-tauri/target/release/bundle/appimage/SecureIT-x86_64.AppImage
            desktop/api/api-linux-x86_64-${{ steps.version.outputs.ver }}.zip
            desktop/api/payload-linux-x86_64.json
            desktop/latest-linux-x86_64.json

  publish-release:
    name: Publish Release
    needs: [create-release, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
