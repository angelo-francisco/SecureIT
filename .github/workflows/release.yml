name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "SecureIT ${{ steps.get_tag.outputs.tag }}"
          draft: true
          generate_release_notes: true

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/api/requirements-desktop.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1+cpu torchvision==0.18.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-desktop.txt pyinstaller
        working-directory: desktop/api

      - name: Download facenet weights
        run: |
          mkdir -p models
          if not exist models\20180402-114759-vggface2.pt curl -L -o models\20180402-114759-vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: pyinstaller desktop-api.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        run: |
          robocopy dist\desktop-api ..\src-tauri\resources\api\desktop-api /E /NFL /NDL /NJH /NJS /NC /NS
          if %ERRORLEVEL% GEQ 8 exit /b 1
          del ..\src-tauri\resources\api\PLACEHOLDER.txt

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/api/requirements-desktop.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1+cpu torchvision==0.18.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-desktop.txt pyinstaller
        working-directory: desktop/api

      - name: Download facenet weights
        run: |
          mkdir -p models
          test -f models/20180402-114759-vggface2.pt || curl -L -o models/20180402-114759-vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: pyinstaller desktop-api.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        run: |
          cp -r dist/desktop-api ../src-tauri/resources/api/
          rm -f ../src-tauri/resources/api/PLACEHOLDER.txt

      # AppImage is excluded: linuxdeploy cannot resolve the libs bundled by
      # PyInstaller (_internal/*.libs), so only the .deb is produced in CI.
      - name: Build Tauri app
        run: pnpm tauri build --bundles deb

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb

  publish-release:
    name: Publish Release
    needs: [create-release, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
