name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "SecureIT ${{ steps.get_tag.outputs.tag }}"
          draft: true
          generate_release_notes: true

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group build --frozen

      - name: Download facenet and yolo
        shell: bash
        run: |
          mkdir -p models
          test -f models/vggface2.pt || curl -L -o models/vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
          test -f models/yolo26n.pt || curl -L -o models/yolo26n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        working-directory: desktop/api
        run: |
          python -c "import shutil, pathlib; src=pathlib.Path('dist')/'desktop-api'; dst=pathlib.Path('../src-tauri')/'resources'/'api'; shutil.rmtree(dst, ignore_errors=True); dst.mkdir(parents=True); shutil.copytree(src, dst/'desktop-api'); exe=dst/'desktop-api'/'desktop-api.exe'; assert exe.exists(), 'API nao embutida: '+str(exe); names={p.name for p in dst.rglob('*')}; assert 'vggface2.pt' in names and 'yolo26n.pt' in names, 'models ausentes no bundle'; print('OK - API + models embutidos em', dst)"

      - name: Build Tauri app
        run: bun run tauri build
        env:
          VITE_API_URL: "http://localhost:8000"
          VITE_WEB_URL: "https://secureit-web.ag-fran-dev.workers.dev/"

      - name: Rename installers
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Move-Item $exe.FullName "src-tauri/target/release/bundle/nsis/SecureIT.exe" -Force

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          Move-Item $msi.FullName "src-tauri/target/release/bundle/msi/SecureIT.msi" -Force

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/msi/SecureIT.msi
            desktop/src-tauri/target/release/bundle/nsis/SecureIT.exe

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: desktop/api

      - name: Install dependencies
        run: uv sync --group build --frozen
        working-directory: desktop/api

      - name: Download facenet and yolo
        run: |
          mkdir -p models
          test -f models/vggface2.pt || curl -L -o models/vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
          test -f models/yolo26n.pt || curl -L -o models/yolo26n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        working-directory: desktop/api
        run: |
          cp -r dist/desktop-api ../src-tauri/resources/api/
          rm -f ../src-tauri/resources/api/PLACEHOLDER.txt
          test -f ../src-tauri/resources/api/desktop-api/desktop-api \
            && (test -f ../src-tauri/resources/api/desktop-api/models/vggface2.pt \
                || test -f ../src-tauri/resources/api/desktop-api/_internal/models/vggface2.pt) \
            && (test -f ../src-tauri/resources/api/desktop-api/models/yolo26n.pt \
                || test -f ../src-tauri/resources/api/desktop-api/_internal/models/yolo26n.pt) \
            && echo "OK - API + models embutidos"

      - name: Build Tauri app
        run: bun run tauri build --bundles deb
        env:
          VITE_API_URL: "http://localhost:8000"
          VITE_WEB_URL: "https://secureit-web.ag-fran-dev.workers.dev/"

      - name: Rename package
        run: |
          mv src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/SecureIT.deb

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/SecureIT.deb

  publish-release:
    name: Publish Release
    needs: [create-release, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
