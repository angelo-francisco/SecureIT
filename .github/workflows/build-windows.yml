name: Build Windows

on:
  workflow_call:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install LLD
        shell: bash
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: desktop/api

      - name: Install dependencies
        run: uv sync --group build --frozen
        working-directory: desktop/api

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: desktop/api/models
          key: ai-models

      - name: Download facenet and yolo
        shell: bash
        run: |
          mkdir -p models
          test -f models/vggface2.pt || curl -L -o models/vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
          test -f models/yolo26n.pt || curl -L -o models/yolo26n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            desktop/api/build
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('desktop/api/**/*.py', 'desktop/api/build.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        working-directory: desktop/api
        run: |
          python -c "import shutil, pathlib; src=pathlib.Path('dist')/'desktop-api'; dst=pathlib.Path('../src-tauri')/'resources'/'api'; shutil.rmtree(dst, ignore_errors=True); dst.mkdir(parents=True); shutil.copytree(src, dst/'desktop-api'); exe=dst/'desktop-api'/'desktop-api.exe'; assert exe.exists(), 'API nao embutida: '+str(exe); names={p.name for p in dst.rglob('*')}; assert 'vggface2.pt' in names and 'yolo26n.pt' in names, 'models ausentes no bundle'; tz=list(dst.rglob('timezonesets/Default')); assert tz, 'timezonesets ausente no bundle (postgres nao arranca)'; print('OK - API + models + timezonesets embutidos em', dst)"

      - name: Build API update archive
        shell: bash
        working-directory: desktop/api
        run: |
          python -c "import shutil; shutil.make_archive('api-windows', 'zip', 'dist', 'desktop-api')"
          echo "API archive built"

      - name: Build Tauri app
        run: bun run tauri build --bundles nsis updater
        env:
          RUSTC_WRAPPER: sccache
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename installers
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Move-Item $exe.FullName "src-tauri/target/release/bundle/nsis/SecureIT.exe" -Force

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/SecureIT.exe
            desktop/src-tauri/target/release/bundle/updater/*.zip
            desktop/src-tauri/target/release/bundle/updater/*.sig
            desktop/api/api-windows.zip
