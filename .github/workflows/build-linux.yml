name: Build Linux

on:
  workflow_call:

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: desktop/api

      - name: Install dependencies
        run: uv sync --group build --frozen
        working-directory: desktop/api

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: desktop/api/models
          key: ai-models

      - name: Download facenet and yolo
        run: |
          mkdir -p models
          test -f models/vggface2.pt || curl -L -o models/vggface2.pt https://github.com/timesler/facenet-pytorch/releases/download/v2.2.9/20180402-114759-vggface2.pt
          test -f models/yolo26n.pt || curl -L -o models/yolo26n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
        working-directory: desktop/api

      - name: Write API env file
        shell: bash
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
        run: |
          if [ -z "$API_ENV_FILE" ]; then
            echo "::error::Secret API_ENV_FILE is not configured. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$API_ENV_FILE" > .env
        working-directory: desktop/api

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            desktop/api/build
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('desktop/api/**/*.py', 'desktop/api/build.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Build API bundle (PyInstaller)
        run: uv run pyinstaller build.spec
        working-directory: desktop/api

      - name: Stage API bundle for Tauri
        working-directory: desktop/api
        run: |
          cp -r dist/desktop-api ../src-tauri/resources/api/
          rm -f ../src-tauri/resources/api/PLACEHOLDER.txt
          test -f ../src-tauri/resources/api/desktop-api/desktop-api \
            && (test -f ../src-tauri/resources/api/desktop-api/models/vggface2.pt \
                || test -f ../src-tauri/resources/api/desktop-api/_internal/models/vggface2.pt) \
            && (test -f ../src-tauri/resources/api/desktop-api/models/yolo26n.pt \
                || test -f ../src-tauri/resources/api/desktop-api/_internal/models/yolo26n.pt) \
            && (test -f ../src-tauri/resources/api/desktop-api/pgserver/pginstall/share/postgresql/timezonesets/Default \
                || test -f ../src-tauri/resources/api/desktop-api/_internal/pgserver/pginstall/share/postgresql/timezonesets/Default) \
            && echo "OK - API + models + timezonesets embutidos"

      - name: Build Tauri app
        run: bun run tauri build --bundles deb
        env:
          RUSTC_WRAPPER: sccache
          VITE_API_URL: "http://localhost:8000"
          VITE_WEB_URL: "https://secureit-web.ag-fran-dev.workers.dev/"

      - name: Rename package
        run: |
          mv src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/SecureIT.deb

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/deb/SecureIT.deb
