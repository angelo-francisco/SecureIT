[project]
name = "secureit-api"
version = "0.2.0"
description = "A segurança mais próximo de si."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.138.0",
    "uvicorn[standard]==0.49.0",
    "tortoise-orm==1.1.7",
    "aerich==0.8.1",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "tortoise-vector==0.2.0",
    "pgserver==0.1.4",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    "numpy==2.5.0",
    "pillow==12.2.0",
    "opencv-python-headless==4.13.0.92",
    "cv2-enumerate-cameras==1.3.3",
    "imutils==0.5.4",
    "torch",
    "torchvision",
    "facenet-pytorch==2.5.3",
    "ultralytics-opencv-headless==8.4.80",
    "orjson==3.11.9",
    "python-dotenv==1.2.2",
    "psutil==7.2.2",
]

[tool.taskipy.tasks]
run = "uvicorn main:app --reload"

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp312-cp312-linux_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp312-cp312-linux_x86_64.whl" }

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.aerich]
tortoise_orm = "core.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
