[project]
name = "secureit-api"
version = "0.2.0"
description = "A segurança mais próximo de si."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "uvicorn[standard]>=0.42.0",
    "tortoise-orm>=0.21.0",
    "aerich>=0.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cv2-enumerate-cameras>=1.3.1",
    "imutils>=0.5.4",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "orjson>=3.11.7",
    "pi-heif>=1.3.0",
    "pillow>=12.1.0",
    "sqlean-py>=3.50.4.5",
    "sqlite-vec>=0.1.6",
    "torch",
    "torchvision",
    "ultralytics>=8.4.75",
    "facenet>=1.0.5",
    "facenet-pytorch>=2.5.3",
]

[tool.taskipy.tasks]
run = "uvicorn main:app --reload"

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp312-cp312-linux_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp312-cp312-linux_x86_64.whl" }
