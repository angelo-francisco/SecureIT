{% extends 'bases/_base.html' %}
{% load static %}
{% block body %}
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 z-10 w-full">
        <div class="w-full max-w-[480px] flex flex-col">
            <div class="flex flex-col items-center mb-8">
                {% include 'components/full_logo.html' %}
                <p class="text-text-muted text-center mt-2 font-body text-sm">A segurança mais próximo de si</p>
            </div>
            <div class="bg-surface-dark border border-border-dark rounded-2xl shadow-2xl overflow-hidden backdrop-blur-sm bg-opacity-95">
                <div class="p-6 sm:p-8">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </main>
{% endblock body %}
