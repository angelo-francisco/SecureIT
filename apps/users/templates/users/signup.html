<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
</head>

<body>

<h2>Criar Conta</h2>

<input type="text" id="phone" placeholder="Telefone"><br><br>
<input type="password" id="pin" placeholder="PIN"><br><br>

<button onclick="signupUser()">Cadastrar</button>

<p id="msg"></p>

<script>
function signupUser() {
    const phone = document.getElementById("phone").value;
    const pin = document.getElementById("pin").value;

    fetch("/users/api/signup/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            phone: phone,
            pin: pin
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("msg").innerText =
            data.message || data.error;
    })
    .catch(() => {
        document.getElementById("msg").innerText = "Erro de conexão";
    });
}
</script>

</body>
</html>
