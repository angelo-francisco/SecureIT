services:
  web:
    build: ./web
    container_name: secureit-web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file:
      - ./web/.env.local

  api:
    build: ./desktop/api
    container_name: secureit-api
    ports:
      - "8000:8000"
    volumes:
      - ./desktop/api:/app
      - /home/kiluzx/Downloads:/downloads
    privileged: true
    environment:
      - DEBUG=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: secureit-db
    environment:
      POSTGRES_USER: secureit
      POSTGRES_PASSWORD: secureit
      POSTGRES_DB: secureit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureit"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: a@a.c
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: