services:
  web:
    build: ./web
    container_name: secureit-web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file:
      - ./web/.env.local

  api:
    build: ./desktop/api
    container_name: secureit-api
    ports:
      - "8000:8000"
    volumes:
      - ./desktop/api:/app
    privileged: true
    environment:
      - DEBUG=1
      - ED25519_PUBLIC_KEY_PATH=/app/ed25519_public.pem
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: secureit-db
    environment:
      POSTGRES_USER: secureit
      POSTGRES_PASSWORD: secureit
      POSTGRES_DB: secureit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: