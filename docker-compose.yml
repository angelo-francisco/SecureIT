services:
  api:
    build: ./api
    container_name: secureit-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    privileged: true
    environment:
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  desktop:
    build: ./frontend/apps/desktop
    container_name: secureit-desktop
    ports:
      - "1420:1420"
      - "1421:1421"
    volumes:
      - ./frontend/apps/desktop:/app
      - /app/node_modules
    environment:
      - TAURI_DEV_HOST=0.0.0.0
      - CI=TAURI_DEV_HOST
    depends_on:
      - api

  db:
    image: pgvector/pgvector:pg16
    container_name: secureit-db
    environment:
      POSTGRES_USER: secureit
      POSTGRES_PASSWORD: secureit
      POSTGRES_DB: secureit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
