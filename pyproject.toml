[project]
name = "secureit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "gunicorn>=23.0.0",
    "watchdog>=6.0.0",
]

[tool.taskipy.tasks]
run = "gunicorn core.wsgi:application"
hrun = "watchmedo auto-restart --patterns='*.py;*.html;*.css' --ignore-directories --recursive --verbose -- gunicorn core.wsgi:application"
mg = "python manage.py migrate"
mkmg = "python manage.py makemigrations"
app = "python manage.py startapp"
