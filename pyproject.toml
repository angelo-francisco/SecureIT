[project]
name = "secureit"
version = "0.1.0"
description = "SecureIT: A segurança mais próximo de si."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "cv2-enumerate-cameras>=1.3.1",
    "daphne>=4.2.1",
    "django>=6.0",
    "facenet-pytorch>=2.5.3",
    "imutils>=0.5.4",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.0",
    "sqlite-vec>=0.1.6",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[tool.taskipy.tasks]
run = "python manage.py runserver"
mg = "python manage.py migrate && python apps/people/db.py"
mkmg = "python manage.py makemigrations"
app = "python manage.py startapp"
