{% extends 'bases/users.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="pt-2 pb-2 relative">
    <div class="flex flex-col gap-2 pb-6">
        <h2 class="text-white text-[28px] font-bold leading-tight tracking-[-0.015em]">Crie a sua conta</h2>
        <p class="text-[#9dabb9] text-sm font-normal">
            Preencha os campos abaixo para registrar as suas informações como administrador do sistema
        </p>
    </div>
    <form action="#" class="flex flex-col gap-5">
        <label class="flex flex-col w-full">
            <p class="text-white text-sm font-medium leading-normal pb-2">Nome do administrador</p>
            {% include 'components/input.html' with placeholder="Digite o nome do administrador" type="text" icon="person" %}
        </label>
        <label class="flex flex-col w-full">
            <p class="text-white text-sm font-medium leading-normal pb-2">Endereço eletrónico</p>
            {% include 'components/input.html' with placeholder="Digite o seu endereço eletrónico" type="email" icon="email" %}
        </label>
        <div class="flex flex-col sm:flex-row gap-4">
            <label class="flex flex-col w-full flex-1">
                <p class="text-white text-sm font-medium leading-normal pb-2">Palavra-passe</p>
                {% include 'components/input.html' with placeholder="Digite uma alavra-passe" type="password" icon="lock" %}
            </label>
        </div>
        <button
            class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-[0.015em] transition-all shadow-[0_0_15px_rgba(19,127,236,0.3)] hover:shadow-[0_0_20px_rgba(19,127,236,0.5)]"
            type="button">
            <span class="truncate flex items-center gap-1">
                Avançar
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </span>
        </button>
    </form>
</div>
{% endblock %}
