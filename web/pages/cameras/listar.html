<h1>Câmaras</h1>

<a href="{% url 'criar_camera' %}">➕ Nova Câmara</a>

<ul>
  {% for cam in cameras %}
    <li>
      <strong>{{ cam.nome }}</strong> — {{ cam.localizacao }}

      <a href="{% url 'ver_camera' cam.id %}">Ver</a>
      <a href="{% url 'eliminar_camera' cam.id %}">Eliminar</a>
    </li>
  {% empty %}
    <li>Nenhuma câmara cadastrada.</li>
  {% endfor %}
</ul>
