{% extends 'bases/panel.html' %}

{% block title %}Adicionar Câmera{% endblock %}

{% block content %}
<form method="post" class="h-full" action="{% url 'cameras:new' %}">
  {% csrf_token %}
  <main class="flex-1 h-full flex flex-col relative overflow-hidden">
    <header class="w-full px-6 py-4 text-center">
      <h1 class="text-white text-2xl font-black">Adicionar de câmara</h1>
      <p class="text-[#9dabb9] mt-1 text-sm">
        Selecione o tipo de conexão da câmera e configure o acesso
      </p>
    </header>

    <div class="flex-1 overflow-y-auto px-6 pb-10">
      <div class="mx-auto max-w-3xl rounded-xl bg-[#1c2127] p-4 border border-[#283039] shadow-xl">
        <div class="flex flex-col gap-3 md:flex-row mb-4">
          <div>
            <label class="text-sm text-white font-medium">Nome</label>
            <input name="name" placeholder="Nome da câmara" required value="{{request.POST.name}}"
              class="mt-1 h-10 w-full rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white" />
          </div>
          <div>
            <label class="text-sm text-white font-medium">Localização</label>
            <input name="location" placeholder="Localização da câmara" required value="{{request.POST.location}}"
              class="mt-1 h-10 w-full rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white" />
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-white mb-1">Tipo de Conexão *</label>
          <select id="connection-type-select" name="connection_type"
            class="w-full h-10 rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
            <option value="L" selected>Local / USB</option>
            <option value="W">Wi-Fi</option>
          </select>
        </div>
        <div class="space-y-4">
          <div id="wifi-fields" class="space-y-2">
            <div>
              <label class="text-sm text-white font-medium">URL da Câmera *</label>
              <input value="{{request.POST.stream_url}}" name="stream_url" placeholder="Ex: rtsp://192.168.1.10:554/stream"
                class="mt-1 h-10 w-full rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white" />
            </div>
            <div>
              <label class="text-sm text-white font-medium">Username</label>
              <input name="username" placeholder="Usuário da câmera" value="{{request.POST.username}}"
                class="mt-1 h-10 w-full rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white" />
            </div>
            <div>
              <label class="text-sm text-white font-medium">Password</label>
              <input type="password" name="password" placeholder="Senha da câmera" value="{{request.POST.password}}"
                class="mt-1 h-10 w-full rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white" />
            </div>
          </div>

          <div id="local-fields" class="hidden space-y-2">
            <label class="text-sm text-white font-medium">Dispositivo Detectado</label>
            <select name="local_camera" id="local-devices"
              class="w-full h-10 rounded-lg border border-[#3b4754] bg-[#283039] px-3 text-white">
              <option disabled selected>Carregando...</option>
            </select>
            <p class="text-xs text-gray-400 mt-1">
              Dispositivo conectado fisicamente ao servidor
            </p>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button type="submit" onclick="this.disabled = true; this.form.submit()"
            class="flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-white font-bold text-sm">
            Pronto
            <span class="material-symbols-outlined text-base">arrow_forward</span>
          </button>
        </div>

      </div>
    </div>
  </main>
</form>

<script>
  const connectionSelect = document.getElementById("connection-type-select");
  const wifiFields = document.getElementById("wifi-fields");
  const localFields = document.getElementById("local-fields");
  const localDevicesSelect = document.getElementById("local-devices");

  function toggleFields() {
    const value = connectionSelect.value;
    wifiFields.classList.toggle("hidden", value !== "W");
    localFields.classList.toggle("hidden", value !== "L");

    if (value === "L") fetchLocalCameras();
  }

  async function fetchLocalCameras() {
    localDevicesSelect.innerHTML = `<option disabled selected>Carregando...</option>`;
    try {
      const res = await fetch('/cameras/new/?getCameras=1');
      const data = await res.json();
      localDevicesSelect.innerHTML = `<option disabled selected>Selecione uma das câmaras</option>`;
      data.forEach(cam => {
        const opt = document.createElement('option');
        opt.value = cam.path;
        opt.textContent = `${cam.name} (${cam.path})`;
        localDevicesSelect.appendChild(opt);
      });
    } catch (err) {
      localDevicesSelect.innerHTML = `<option disabled selected>Erro ao carregar câmaras</option>`;
      console.error(err);
    }
  }

  connectionSelect.addEventListener("change", toggleFields);
  toggleFields();
</script>
{% endblock %}
