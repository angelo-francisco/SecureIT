{% extends 'bases/panel_no_nav.html' %}

{% block title %}Painel de Controle{% endblock %}

{% block subhead %}
<style>
    #container[data-count="1"] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
    }

    #container[data-count="2"] {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 1fr;
    }

    #container[data-count="3"],
    #container[data-count="4"] {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
    }

    #container[data-count="5"],
    #container[data-count="6"] {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
    }

    #container[data-count="7"],
    #container[data-count="8"],
    #container[data-count="9"] {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
    }
</style>
{% endblock %}

{% block content %}
<div id="loader" class="flex items-center justify-center h-[calc(100vh-76px)] w-full">
    {% include "components/loader.html" with w=50 %}
</div>

{% include "components/floating_navbar.html" %}
<main id="container" class="
    hidden
    w-full
    h-[100vh]
    bg-black
    grid
    gap-1
  ">
</main>

<script>
    const mainHTML = document.getElementById("container")
    const loader = document.getElementById("loader")

    function getIndexFromPath(id) {
        if (typeof id === "number") return id
        return parseInt(id.replace("/dev/video", ""))
    }

    function connectCameraWs(index) {
        if (typeof index !== "number" && !index) return

        const ws = new WebSocket(`ws:localhost:8000/ws/camera-video/${index}`)
        ws.binaryType = "arraybuffer"

        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            document.getElementById(`cam-${index}`).src = url
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const response = await fetch("/cameras/get-cameras")
        const cameras = await response.json()
        mainHTML.dataset.count = cameras.length
        cameras.forEach(camera => {
            let id;
            if (camera.path) {
                id = camera.path
            } else {
                id = camera.id
            }

            let index = getIndexFromPath(id)
            mainHTML.innerHTML += `
                <div class="relative bg-black w-full h-full overflow-hidden">
                    <img src="" id="cam-${index}" class="absolute inset-0 w-full h-full object-contain bg-black"/>
                    <span class="absolute bottom-1 right-1 text-xs text-green-400 font-mono">
                    CAM-${index}
                    </span>
                </div>
            `
            connectCameraWs(index)
        });

        loader.classList.add('hidden')
        mainHTML.classList.remove('hidden')
    })
</script>
{% endblock %}
