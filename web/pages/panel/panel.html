{% extends 'bases/panel.html' %}

{% block title %}Painel de Controle{% endblock %}

{% block content %}

{% for camera in cameras %}
<div class="cameras grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div class="camera">
        <iframe src="{{ camera.get_video_url }}" width="500" height="400" frameborder="0"></iframe>
    </div>
</div>
{% empty %}
<div class="w-full h-[80vh] flex justify-center items-center flex-col text-center gap-1">
    <div
        class="flex items-center justify-center w-24 h-24 rounded-full bg-surface-dark border-2 border-dashed border-gray-700 text-text-secondary">
        <span class="material-symbols-outlined text-[48px] opacity-50">mimo_disconnect</span>
    </div>
    <div class="flex flex-col gap-2 max-w-md">
        <h3 class="text-white text-xl font-bold">Sem câmaras sendo monitoradas</h3>
    </div>
</div>
{% endfor %}
{% endblock %}
