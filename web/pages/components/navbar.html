<header
    class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-[#353e47] bg-transparent/40 px-4 lg:px-10 py-5 shadow-sm">
    {% include 'components/full-logo.html' %}
    <nav class="hidden md:flex items-center gap-5 md:gap-9">
        <a class="flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
            href="{% url 'panel:home' %}">
            {% lucide "view" %}
            <span class="hidden sm:flex">
                Painel
            </span>
        </a>
        <a class="flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
            href="{% url 'cameras:home' %}">
            {% lucide "video" %}
            <span class="hidden sm:flex">
                Câmaras
            </span>
        </a>
        <a class="flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
            href="{% url 'people:home' %}">
            {% lucide "users" %}
            <span class="hidden sm:flex">
                Pessoas
            </span>
        </a>
        <a class="flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
            href="{% url 'notifications:home' %}">
            {% lucide "bell" %}
            <span class="hidden sm:flex">
                Notificações
            </span>
        </a>
        <a class="flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
            href="/admin">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shield-user-icon lucide-shield-user">
                <path
                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                <path d="M6.376 18.91a6 6 0 0 1 11.249.003" />
                <circle cx="12" cy="11" r="4" />
            </svg>
            <span class="hidden sm:flex">
                Admin
            </span>
        </a>
    </nav>
    <el-dropdown class="md:hidden relative ml-3">
        <button
            class="relative flex rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <el-menu popover anchor="bottom end" class="absolute right-0 top-full mt-2 w-48
               origin-top-right rounded-md bg-gray-800 py-1
               outline outline-white/10
               transition data-closed:scale-95 data-closed:opacity-0">
            <a class="py-2 px-3 border-b border-gray-500 flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
                href="{% url 'panel:home' %}">
                <span class="material-symbols-outlined">
                    admin_panel_settings
                </span>
                <span>
                    Painel
                </span>
            </a>
            <a class="py-2 px-3 border-b border-gray-500 flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
                href="{% url 'cameras:home' %}">
                <span class="material-symbols-outlined">
                    videocam
                </span>
                <span>
                    Câmaras
                </span>
            </a>
            <a class="py-2 px-3 border-b border-gray-500 flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
                href="{% url 'people:home' %}">
                <span class="material-symbols-outlined">
                    people
                </span>
                <span>
                    Pessoas
                </span>
            </a>
            <a class="py-2 px-3 border-b border-gray-500 flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
                href="/admin">
                <span class="material-symbols-outlined">shield_person</span>
                <span>
                    Admin
                </span>
            </a>
            <a class="py-2 px-3 flex items-center gap-1 text-slate-600 dark:text-[#9dabb9] hover:text-primary dark:hover:text-white text-lg font-medium leading-normal transition-colors"
                href="{% url 'notifications:home' %}">
                <span class="material-symbols-outlined">notifications</span>
                <span>
                    Notificações
                </span>
            </a>
        </el-menu>
    </el-dropdown>

</header>
